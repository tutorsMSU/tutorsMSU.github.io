<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анкета преподавателя</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .wrapper { max-width: 700px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #34495e; }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px;
        }
        textarea { resize: vertical; min-height: 100px; }
        button { 
            width: 100%; padding: 15px; background: #27ae60; color: white; border: none; 
            font-size: 18px; border-radius: 6px; cursor: pointer; transition: 0.3s; 
        }
        button:hover { background: #229953; }
        .instructions { background: #fff3cd; border: 1px solid #ffeaa7; color: #856404; padding: 15px; border-radius: 6px; margin-bottom: 25px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Анкета преподавателя</h1>
        <div class="instructions">
            <strong>Инструкция:</strong> Заполните поля ниже. После заполнения нажмите кнопку "Подготовить результат". Текст из желтого блока скопируйте и отправьте администратору.
        </div>

        <!-- Блок ввода данных -->
        <div class="form-group">
            <label>ФИО полностью:</label>
            <input type="text" id="name" placeholder="Иванов Иван Иванович">
        </div>
        <div class="form-group">
            <label>ВУЗ и специальность:</label>
            <input type="text" id="university" placeholder="МГУ им. Ломоносова, Механико-математический факультет">
        </div>
        <div class="form-group">
            <label>Предметы (через запятую):</label>
            <input type="text" id="subjects" placeholder="Математика, Физика">
        </div>
        <div class="form-group">
            <label>Стаж преподавания (лет):</label>
            <input type="number" id="experience" placeholder="5">
        </div>
        <div class="form-group">
            <label>Стоимость 60 минут (₽):</label>
            <input type="number" id="price" placeholder="1500">
        </div>
        <div class="form-group">
            <label>Количество выпускников / подготовленных учеников:</label>
            <input type="number" id="graduates" placeholder="50">
        </div>
        <div class="form-group">
            <label>Средний балл ЕГЭ/ОГЭ учеников:</label>
            <input type="text" id="avg-grade" placeholder="85+ баллов">
        </div>
        <div class="form-group">
            <label>Личные достижения (Олимпиады, гранты, степени):</label>
            <textarea id="achievements" placeholder="Призер олимпиады Физтех, Кандидат наук"></textarea>
        </div>
        <div class="form-group">
            <label>Баллы ЕГЭ/ОГЭ по своему предмету (если сдавал недавно):</label>
            <input type="text" id="own-scores" placeholder="ЕГЭ Математика - 100 баллов">
        </div>
        <div class="form-group">
            <label>Немного о себе для расположения клиентов (хобби, семья, животные):</label>
            <textarea id="bio" placeholder="Есть собака породы корги, люблю походы..."></textarea>
        </div>

        <button onclick="generateOutput()">Подготовить результат</button>

        <!-- Блок вывода готового текста -->
        <h2 style="margin-top:40px;">Результат для сайта:</h2>
        <textarea id="output" readonly style="background:#f9f9f9;color:#333;"></textarea>
    </body>

<script>
function generateOutput() {
    const name = document.getElementById('name').value;
    const uni = document.getElementById('university').value;
    const subjects = document.getElementById('subjects').value;
    const exp = document.getElementById('experience').value;
    const price = document.getElementById('price').value;
    const grads = document.getElementById('graduates').value;
    const avg = document.getElementById('avg-grade').value;
    const ach = document.getElementById('achievements').value;
    const scores = document.getElementById('own-scores').value;
    const bio = document.getElementById('bio').value;

    const resultText = `
**Имя:** ${name}
**ВУЗ:** ${uni}
**Предметы:** ${subjects}
**Стаж:** ${exp} лет
**Цена:** ${price} ₽/час
**Выпускников:** ${grads}
**Средний балл:** ${ach !== '' ? ach + '. ' : ''}${scores !== '' ? scores + '. ' : ''}Средний балл учеников: ${avg}.
**Для клиентов:** ${bio}`;

    document.getElementById('output').value = resultText.trim();
}
</script>

</html>
